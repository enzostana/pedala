version: '3.8'
services:
  app:
    image: pedala:1.3.1
    environment:
      NOMINATIM_URL: http://nominatim:8080
      VALHALLA_URL: http://valhalla:8002
  nominatim:
    image: mediagis/nominatim@sha256:168c30e20fbba0c2e8199fca7a8aa2640e8cc1a62f8b05b1958897796fdb38f1
    environment:
      PBF_PATH: /data/rio-de-janeiro.osm.pbf
      THREADS: '2'
      GUNICORN_WORKERS: '2'
      UPDATE_MODE: none
      IMPORT_WIKIPEDIA: 'false'
      WARMUP_ON_STARTUP: 'false'
      POSTGRES_SHARED_BUFFERS: 512MB
      POSTGRES_MAINTENANCE_WORK_MEM: 512MB
    volumes:
      - pedala_geocoder_data:/var/lib/postgresql/16/main
      - ${PEDALA_OSM_DIR:-/home/cinadmin/pedala-geodata/source}:/data:ro
    networks: [pedala]
    logging:
      driver: none
    configs:
      - source: nominatim_logging
        target: /etc/postgresql/16/main/conf.d/zz-pedala-logging.conf
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:8080/status?format=json >/dev/null']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      replicas: 1
      placement:
        constraints: [node.hostname == s2951cetriov049]
      resources:
        limits:
          cpus: '2.0'
          memory: 3G
      restart_policy:
        condition: on-failure
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted@sha256:3eaac5d4d4e8883690c119cfd22bac31abcde3fd834d3ef10e017501a597dfaf
    environment:
      server_threads: '2'
      use_tiles_ignore_pbf: 'True'
      build_elevation: 'False'
      build_transit: 'False'
      build_time_zones: 'False'
      use_default_speeds_config: 'False'
    volumes:
      - ${PEDALA_VALHALLA_DIR:-/home/cinadmin/pedala-geodata/valhalla}:/custom_files
    networks: [pedala]
    logging:
      driver: none
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:8002/status >/dev/null']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      replicas: 1
      placement:
        constraints: [node.hostname == s2951cetriov049]
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
      restart_policy:
        condition: on-failure
volumes:
  pedala_geocoder_data:
    external: true
    name: ${PEDALA_GEO_DATA:-pedala_geocoder_data}

configs:
  nominatim_logging:
    file: ./nominatim-logging.conf
