# Optional overlay. Apply together with stack.yml after creating the secret.
version: "3.8"
services:
  app:
    environment:
      GEOAPIFY_API_KEY_FILE: /run/secrets/pedala_geoapify_api_key
    secrets:
      - source: pedala_geoapify_api_key
        target: pedala_geoapify_api_key
secrets:
  pedala_geoapify_api_key:
    external: true
    name: ${GEOAPIFY_SECRET_NAME:-pedala_geoapify_api_key}
